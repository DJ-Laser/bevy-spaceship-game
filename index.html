<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bevy Game</title>
    <style>
        /* Reset and enforce a clean dark background */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #181818;
            font-family: sans-serif;
            overflow: hidden; /* Prevents scrollbars if the canvas fills the screen */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Styling for the loading text */
        #loading {
            color: #ffffff;
            font-size: 1.5rem;
            position: absolute;
        }

        /* Bevy targets the canvas element to render the game */
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <div id="loading">Loading Game...</div>

    <!-- The WASM initialization script generated by wasm-bindgen -->
    <script type="module">
        // IMPORTANT: Replace 'YOUR_GAME_NAME' with the exact name used in your Cargo.toml and deploy.yml
        import init from './bevy-spaceship-game.js';

        async function run() {
            try {
                // Initialize the WASM module
                await init();
                
                // Hide the loading message once the game starts rendering
                const loadingElement = document.getElementById('loading');
                if (loadingElement) {
                    loadingElement.style.display = 'none';
                }
            } catch (error) {
                console.error("Error initializing Bevy game:", error);
                document.getElementById('loading').innerText = "Failed to load game. Check console for details.";
            }
        }

        run();
    </script>
</body>
</html>
